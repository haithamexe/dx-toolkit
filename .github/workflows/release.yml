name: Release

# Pushing a tag vX.Y.Z publishes dx-devkit X.Y.Z to npm and creates the GitHub release.
# npm trusts this workflow directly (trusted publishing): there's no npm token in the
# repository, and the package carries provenance saying which commit and workflow built it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; kept on 11 so a new major can't change publishing under us.
      - run: npm install -g npm@11 && npm --version

      - run: npm ci

      - name: The tag matches the version and the changelog
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi
          for f in packages/*/package.json; do
            case "$f" in packages/raycast/*) continue ;; esac
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then echo "::error::$f is $v, not $version."; exit 1; fi
          done
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The dx app's Electron gets its security fixes through dx's releases.
      - name: The app's Electron is the newest of its line
        run: node scripts/check-electron.mjs

      - run: npm test

      - name: Build and test-install the package
        run: |
          npm run release
          node scripts/smoke-package.mjs

      - name: Publish to npm
        run: |
          set -o pipefail
          if npm view "dx-devkit@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "dx-devkit@$VERSION is already on npm."
          elif ! npm publish ./release --provenance --access public --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            # npm's own error lines, and what it said about trusted publishing (OIDC), on the run's
            # summary page: readable without opening the log.
            reason=$(grep -iE "oidc|trusted|npm error code|npm error 40[0-9] [A-Z]" "$RUNNER_TEMP/publish.log" | grep -v "^npm verbose cli" | tail -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            echo "::error title=npm publish failed::${reason:-npm printed no error line; see the log of this step}"
            exit 1
          fi

      - name: Install it from npm and run it
        run: |
          for i in $(seq 1 30); do
            npm view "dx-devkit@$VERSION" version --prefer-online >/dev/null 2>&1 && break
            sleep 10
          done
          npm_config_prefer_online=true node scripts/smoke-package.mjs --from-npm

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "dx $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
          fi
