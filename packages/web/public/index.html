<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="dx-token" content="__DX_TOKEN__" />
    <meta name="color-scheme" content="light dark" />
    <title>dx dashboard</title>
    <link rel="icon" href="floppy.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app">
      <header class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="floppy.svg" alt="" width="28" height="28" />
          <span class="brand-name">dx</span>
        </div>
        <div class="project-switch" id="project-switch"></div>
        <nav class="nav" aria-label="Main" id="nav"></nav>
        <div class="sidebar-foot">
          <div class="sidebar-floppy-row" id="floppy-row">
            <img class="sidebar-floppy" src="floppy-idle.svg" alt="" width="64" height="60" />
          </div>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <div class="offline" id="offline" role="alert" hidden></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <dialog class="dialog" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <form method="dialog" class="dialog-body">
        <h2 class="dialog-title" id="confirm-title"></h2>
        <div class="dialog-text" id="confirm-text"></div>
        <div class="dialog-actions">
          <button class="btn" value="cancel" type="submit">Cancel</button>
          <button class="btn btn-danger" value="ok" type="submit" id="confirm-ok">Confirm</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
